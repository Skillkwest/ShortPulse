        run: |
          set -euo pipefail
          MODE="${AGENT_ROLLBACK_VERIFICATION_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown AGENT_ROLLBACK_VERIFICATION_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          set +e
          cd ..
          node scripts/check_agent_rollback_verification.js
          STATUS=$?
          set -e

