name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  deadcode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run deadcode:check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run test -- auth-helper proxy-internal-utils auth-guarded-ai-routes fal-status.auth-context fal-status.ownership auth-latency-benchmark
      - run: npm test
      - run: npm run build

  docs_semantic_drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run semantic docs drift checks (warn/enforce)
        env:
          DOCS_SEMANTIC_DRIFT_MODE: ${{ vars.DOCS_SEMANTIC_DRIFT_MODE }}
        run: |
          set -euo pipefail
          MODE="${DOCS_SEMANTIC_DRIFT_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown DOCS_SEMANTIC_DRIFT_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          set +e
          cd ..
          node scripts/check_docs_semantic_drift.js
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "docs_semantic_drift passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::docs_semantic_drift failed in warn mode."
            echo "docs_semantic_drift failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "docs_semantic_drift failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

