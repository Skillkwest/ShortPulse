name: Reliability Control-Plane Diagnostics

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment containing SUPABASE_DB_URL"
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: "warn (non-blocking) or enforce (blocking)"
        required: true
        default: warn
        type: choice
        options:
          - warn
          - enforce

concurrency:
  group: reliability-control-plane-diagnostics-${{ github.event.inputs.target_environment }}
  cancel-in-progress: false

jobs:
  reliability_control_plane_diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.target_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run reliability diagnostics (warn/enforce)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          RELIABILITY_DIAGNOSTICS_MODE: ${{ github.event.inputs.mode }}
          RELIABILITY_DIAGNOSTICS_LOG_DIR: /tmp/reliability_control_plane_diagnostics
        run: |
          set -euo pipefail
          MODE="${MODE_INPUT:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown mode '$MODE'. Falling back to warn."
            MODE="warn"
          fi

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing environment secret SUPABASE_DB_URL."
            exit 1
          fi

          set +e
          ./scripts/reliability_control_plane_diagnostics.sh 2>&1 | tee /tmp/reliability_control_plane_diagnostics.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "reliability_control_plane_diagnostics passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::reliability_control_plane_diagnostics failed in warn mode."
            echo "reliability_control_plane_diagnostics failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "reliability_control_plane_diagnostics failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reliability-control-plane-diagnostics-${{ github.run_id }}
          path: |
            /tmp/reliability_control_plane_diagnostics.log
            /tmp/reliability_control_plane_diagnostics
          if-no-files-found: ignore
