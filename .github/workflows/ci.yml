          REFERENCE_GRID_BOUNDARY_MODE: ${{ vars.REFERENCE_GRID_BOUNDARY_MODE }}
        run: |
          set -euo pipefail
          MODE="${ARCHITECTURE_BOUNDARY_MODE:-warn}"
          RG_MODE="${REFERENCE_GRID_BOUNDARY_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown ARCHITECTURE_BOUNDARY_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi
          if [ "$RG_MODE" != "warn" ] && [ "$RG_MODE" != "enforce" ]; then
            echo "::warning::Unknown REFERENCE_GRID_BOUNDARY_MODE='$RG_MODE'. Falling back to 'warn'."
            RG_MODE="warn"
          fi
          EFFECTIVE_MODE="$MODE"
          if [ "$RG_MODE" = "enforce" ]; then
            EFFECTIVE_MODE="enforce"
          fi

          set +e
          cd ..
          node scripts/check_architecture_boundaries.js
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "architecture_boundary passed (mode=$EFFECTIVE_MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$EFFECTIVE_MODE" = "warn" ]; then
