name: Media Storage Deploy Gate

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to gate"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: media-storage-deploy-gate-${{ github.event.inputs.target_environment }}
  cancel-in-progress: false

jobs:
  media-storage-gate:
    name: Media Storage Gate (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run media storage deploy gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/media_storage_deploy_gate.sh
