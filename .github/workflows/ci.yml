          if [ "$STATUS" -eq 0 ]; then
            echo "migration_parity passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::migration_parity failed in warn mode."
            echo "migration_parity failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "migration_parity failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  archive_manifest_check:
