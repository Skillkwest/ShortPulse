          fi

          echo "agent_disable_continuity failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  agent_rollback_verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
