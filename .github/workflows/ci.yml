  adaptive_media_gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Adaptive Media V2-impacting changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            adaptive_media:
              - 'frontend/lib/adaptive-media/**'
              - 'frontend/features/ai-studio/components/ReferenceGrid.tsx'
              - 'frontend/features/ai-studio/logic/referenceGridMedia.ts'
              - 'frontend/features/ai-studio/components/MediaLibraryModal.tsx'
              - 'frontend/features/character-manager/components/CharacterManagerShell.tsx'
              - 'frontend/features/ai-studio/components/DetailModal.tsx'
              - 'frontend/features/ai-studio/logic/stateParsers.ts'
              - 'frontend/features/ai-studio/hooks/useAiStudioState.ts'
              - 'frontend/lib/mediaPerfTelemetry.ts'
              - 'frontend/package.json'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run Adaptive Media V2 gate
        id: should_run
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changes.outputs.adaptive_media || 'false' }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: ${{ steps.should_run.outputs.run == 'true' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci with transient retry)
        if: ${{ steps.should_run.outputs.run == 'true' }}
        run: bash ../scripts/ci_npm_ci_with_retry.sh
      - if: ${{ steps.should_run.outputs.run == 'true' }}
        run: npm run test:adaptive-v2-gate
      - name: Adaptive Media V2 gate skipped (no adaptive-impacting file changes)
        if: ${{ steps.should_run.outputs.run != 'true' }}
        run: |
          echo "Adaptive Media V2 gate skipped for this PR because no adaptive-impacting files changed." >> "$GITHUB_STEP_SUMMARY"

  ai_studio_perf_gate:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_AUDIT_EMAIL: ${{ secrets.PLAYWRIGHT_AUDIT_EMAIL }}
      PLAYWRIGHT_AUDIT_PASSWORD: ${{ secrets.PLAYWRIGHT_AUDIT_PASSWORD }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect AI Studio perf-impacting changes
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ai_studio:
              - 'frontend/features/ai-studio/**'
              - 'frontend/features/media-library/**'
              - 'frontend/pages/ai-studio.tsx'
              - 'frontend/pages/media-library.tsx'
              - 'frontend/pages/_app.tsx'
              - 'frontend/styles/ai-studio-canvas.css'
              - 'frontend/lib/mediaPerfTelemetry.ts'
              - 'frontend/lib/mediaSignedUrlCache.ts'
              - 'frontend/tests/e2e/ai-studio-perf.audit.js'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run AI Studio perf gate
        id: should_run
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_AUDIT_EMAIL:-}" ] || [ -z "${PLAYWRIGHT_AUDIT_PASSWORD:-}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=run_all_non_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changes.outputs.ai_studio || 'false' }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=changed_files" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "reason=no_perf_impacting_changes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: ${{ steps.should_run.outputs.run == 'true' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci with transient retry)
        if: ${{ steps.should_run.outputs.run == 'true' }}
        run: bash ../scripts/ci_npm_ci_with_retry.sh
      - if: ${{ steps.should_run.outputs.run == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Build production app with perf audit runtime
        if: ${{ steps.should_run.outputs.run == 'true' }}
        run: NEXT_PUBLIC_AI_STUDIO_PERF_AUDIT_RUNTIME=true npm run build
      - name: Run AI Studio production perf gate
        if: ${{ steps.should_run.outputs.run == 'true' }}
        env:
          AI_STUDIO_PERF_GATE_MODE: ${{ vars.AI_STUDIO_PERF_GATE_MODE }}
        run: |
          set -euo pipefail

          MODE="${AI_STUDIO_PERF_GATE_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown AI_STUDIO_PERF_GATE_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          NEXT_PUBLIC_AI_STUDIO_PERF_AUDIT_RUNTIME=true PORT=3100 npm run start >/tmp/ai-studio-start.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:3100/auth?next=/ai-studio" >/dev/null; then
              break
            fi
            sleep 1
          done

          set +e
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 npm run test:perf:ai-studio
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "AI Studio perf gate passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::AI Studio perf gate failed in warn mode. Set repository variable AI_STUDIO_PERF_GATE_MODE=enforce to block merges."
            echo "AI Studio perf gate failed in warn mode. Convert to enforce once stable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "AI Studio perf gate failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
      - name: AI Studio perf gate skipped
        if: ${{ steps.should_run.outputs.run != 'true' }}
        run: |
          case "${{ steps.should_run.outputs.reason }}" in
            missing_secrets)
              echo "AI Studio perf gate skipped because PLAYWRIGHT_AUDIT_EMAIL and/or PLAYWRIGHT_AUDIT_PASSWORD are not configured." >> "$GITHUB_STEP_SUMMARY"
              ;;
            no_perf_impacting_changes)
              echo "AI Studio perf gate skipped for this PR because no AI Studio perf-impacting files changed." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "AI Studio perf gate skipped." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

  secret_scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run secret exposure checks (warn/enforce)
        env:
          SECRET_SCAN_MODE: ${{ vars.SECRET_SCAN_MODE }}
        run: |
          set -euo pipefail
          MODE="${SECRET_SCAN_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown SECRET_SCAN_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          set +e
          cd ..
          node scripts/check_secret_exposure.js
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "secret_scan passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::secret_scan failed in warn mode."
            echo "secret_scan failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "secret_scan failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci with transient retry)
        run: bash ../scripts/ci_npm_ci_with_retry.sh
      - name: Run production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run full dependency audit (advisory)
        run: |
          set +e
          npm audit --audit-level=moderate
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Full dependency audit reported vulnerabilities in dev and/or tooling dependencies."
            echo "security advisory: full dependency audit has findings; production dependency audit remains the blocking gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Full dependency audit passed." >> "$GITHUB_STEP_SUMMARY"
