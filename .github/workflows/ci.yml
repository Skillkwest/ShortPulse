    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci with transient retry)
        run: bash ../scripts/ci_npm_ci_with_retry.sh
      - name: Run agent disable/continuity tests (warn/enforce)
        env:
          AGENT_DISABLE_CONTINUITY_MODE: ${{ vars.AGENT_DISABLE_CONTINUITY_MODE }}
        run: |
