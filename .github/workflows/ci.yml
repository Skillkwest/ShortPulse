            MODE="warn"
          fi

          set +e
          cd ..
          node scripts/check_docs_semantic_drift.js
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "docs_semantic_drift passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::docs_semantic_drift failed in warn mode."
            echo "docs_semantic_drift failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "docs_semantic_drift failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

