        run: |
          set -euo pipefail
          MODE="${ARCHIVE_MANIFEST_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown ARCHIVE_MANIFEST_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          set +e
          cd ..
          node scripts/check_archive_manifest.js
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "archive_manifest_check passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::archive_manifest_check failed in warn mode."
            echo "archive_manifest_check failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "archive_manifest_check failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

  sql_lint:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci with transient retry)
        run: bash ../scripts/ci_npm_ci_with_retry.sh
      - name: Run SQL lint gate (warn/enforce)
        env:
          SQL_LINT_MODE: ${{ vars.SQL_LINT_MODE }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_URL_FALLBACK: ${{ vars.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          MODE="${SQL_LINT_MODE:-warn}"
          if [ "$MODE" != "warn" ] && [ "$MODE" != "enforce" ]; then
            echo "::warning::Unknown SQL_LINT_MODE='$MODE'. Falling back to 'warn'."
            MODE="warn"
          fi

          DB_URL="${SUPABASE_DB_URL:-${SUPABASE_DB_URL_FALLBACK:-}}"
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not configured; cannot run hosted SQL lint."
            if [ "$MODE" = "warn" ]; then
              echo "sql_lint skipped in warn mode (missing SUPABASE_DB_URL)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "sql_lint failed in enforce mode (missing SUPABASE_DB_URL)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          set +e
          npx supabase db lint --db-url "$DB_URL" --schema public --fail-on warning
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "sql_lint passed (mode=$MODE)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$MODE" = "warn" ]; then
            echo "::warning::sql_lint failed in warn mode."
            echo "sql_lint failed in warn mode." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "sql_lint failed in enforce mode." >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

