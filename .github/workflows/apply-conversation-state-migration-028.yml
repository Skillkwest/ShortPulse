name: Apply Conversation State Migration 028

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub Environment containing SUPABASE_DB_URL"
        required: true
        type: choice
        options:
          - staging
          - production
      operation:
        description: "apply (forward migration) or rollback"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - rollback
      confirm_token:
        description: "Type apply-028 or rollback-028 to confirm"
        required: true
        type: string

jobs:
  apply_conversation_state_migration_028:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.target_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply selected migration SQL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPERATION: ${{ github.event.inputs.operation }}
          CONFIRM_TOKEN: ${{ github.event.inputs.confirm_token }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Missing environment secret SUPABASE_DB_URL."
            exit 1
          fi

          if [ "$OPERATION" = "apply" ]; then
            SQL_FILE="sql/migrations/028_harden_ai_agent_conversation_state_security.sql"
            EXPECTED_TOKEN="apply-028"
          elif [ "$OPERATION" = "rollback" ]; then
            SQL_FILE="sql/migrations/rollback/028_harden_ai_agent_conversation_state_security_rollback.sql"
            EXPECTED_TOKEN="rollback-028"
          else
            echo "::error::Unsupported operation: $OPERATION"
            exit 1
          fi

          if [ "$CONFIRM_TOKEN" != "$EXPECTED_TOKEN" ]; then
            echo "::error::Confirmation token mismatch. Expected '$EXPECTED_TOKEN'."
            exit 1
          fi

          if [ ! -f "$SQL_FILE" ]; then
            echo "::error::Missing SQL file: $SQL_FILE"
            exit 1
          fi

          echo "Applying $SQL_FILE"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE" | tee /tmp/conversation_state_migration_028_apply.log

          {
            echo "### Conversation State Migration 028"
            echo "- Environment: ${{ github.event.inputs.target_environment }}"
            echo "- Operation: $OPERATION"
            echo "- SQL file: \`$SQL_FILE\`"
            echo "- Result: success"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-state-migration-028-${{ github.run_id }}
          path: /tmp/conversation_state_migration_028_apply.log
          if-no-files-found: ignore
